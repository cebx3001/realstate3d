<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Torres del Norte — viewport QA</title><style>
*{box-sizing:border-box;border-radius:0!important}body{margin:0;padding:16px;background:#24272a;color:#fff;font:11px monospace}header{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}select,button{font:inherit;padding:7px;color:#fff;background:#0F151F;border:1px solid #68635b}iframe{box-sizing:content-box;display:block;border:1px solid #68635b;width:390px;height:844px}output{color:#D2B16B}
</style></head><body><header>
<label>VIEWPORT <select id="viewport"><option value="390,844">390 × 844</option><option value="360,640">360 × 640</option><option value="430,932">430 × 932</option><option value="1280,800">1280 × 800</option></select></label>
<label>VISTA <select id="target"><option value="cover">PORTADA</option><option value="inventory-47">17A</option><option value="inventory-48">35B</option><option value="inventory-50">28C</option></select></label>
<button data-state="cover">COVER</button><button data-state="neighborhood">ENTORNO</button><button data-state="technical">UNITS</button>
<label>CATEGORÍA <select id="category"><option value="education">01 EDUCACIÓN</option><option value="commerce">02 COMERCIO</option><option value="parks">03 PARQUES</option><option value="culture">04 CULTURA</option><option value="mobility">05 MOVILIDAD</option><option value="services">06 SERVICIOS</option></select></label>
<output id="status">LOADING</output></header><iframe id="preview" src="./?qa=grid-3" title="Torres del Norte — live viewport"></iframe><script>
const frame=document.getElementById('preview');
document.getElementById('viewport').addEventListener('change',event=>{const [width,height]=event.target.value.split(',');frame.style.width=width+'px';frame.style.height=height+'px';});
document.getElementById('target').addEventListener('change',event=>{frame.src=event.target.value==='cover'?'./?qa=grid-3':`./inventory/?unit=${event.target.value}&room=living&qa=grid-1`;document.getElementById('status').textContent=event.target.value.toUpperCase();});
document.querySelectorAll('[data-state]').forEach(button=>button.addEventListener('click',()=>frame.contentDocument.querySelector(`[data-go="${button.dataset.state}"]`)?.click()));
document.getElementById('category').addEventListener('change',event=>{const trigger=frame.contentDocument.querySelector('[data-go="neighborhood"]');if(trigger?.getAttribute('aria-expanded')==='false')trigger.click();frame.contentDocument.querySelector(`[data-category="${event.target.value}"]`)?.click();});
setInterval(()=>{const experience=frame.contentWindow.__tdnExperience;if(experience)document.getElementById('status').textContent=`${experience.state.toUpperCase()} / ${experience.category.toUpperCase()} / 3D ${experience.engine.toUpperCase()}`;},500);
</script></body></html>
