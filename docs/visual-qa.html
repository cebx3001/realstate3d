<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Torres del Norte — viewport QA</title><style>*{box-sizing:border-box;border-radius:0!important}body{margin:0;padding:16px;background:#24272a;color:#fff;font:11px monospace}header{display:flex;gap:18px;align-items:center;margin-bottom:12px;flex-wrap:wrap}select,input,button{font:inherit;padding:7px;color:#fff;background:#0F151F;border:1px solid #68635b}input{width:75px}iframe{box-sizing:content-box;display:block;border:1px solid #68635b;width:390px;height:844px}output{color:#D2B16B}</style></head><body><header><label>VIEWPORT <select id="viewport"><option value="390,844">390 × 844</option><option value="360,640">360 × 640</option><option value="430,932">430 × 932</option><option value="1280,800">1280 × 800</option></select></label><label>PROGRESO <input id="progress" type="number" min="0" max="1" step=".001" value="0"></label><button id="seek">VER PROGRESO</button><output id="status">LIVE / DEPTH-1</output></header><iframe id="preview" src="./?qa=depth-1" title="Torres del Norte — live viewport"></iframe><script>
const frame=document.getElementById('preview');
document.getElementById('viewport').addEventListener('change',event=>{const [width,height]=event.target.value.split(',');frame.style.width=width+'px';frame.style.height=height+'px';});
document.getElementById('seek').addEventListener('click',()=>{frame.contentWindow.__tdnExperience?.seek(Number(document.getElementById('progress').value));});
setInterval(()=>{const experience=frame.contentWindow.__tdnExperience;if(experience)document.getElementById('status').textContent=`P ${experience.progress.toFixed(3)} / 3D ${experience.engine.toUpperCase()}`;},500);
</script></body></html>
